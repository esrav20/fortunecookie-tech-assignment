name: Main Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Build backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.16'

      - name: Build
        working-directory: backend
        run: go build ./...

  frontend:
    name: Build & test frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.16'

      - name: Build
        working-directory: frontend
        run: go build ./...

      - name: Test
        working-directory: frontend
        run: go test ./... -v
